
<!DOCTYPE html>
<html>
<head>
    <title>Weather Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #dbeafe;
            text-align: center;
            padding: 40px;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 350px;
            margin: auto;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
        button {
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Weather Dashboard</h2>
        <input id="city" placeholder="Enter city name">
        <button onclick="getWeather()">Get Weather</button>
        <div id="result"></div>
    </div>

    <script>
        async function getWeather() {
            let city = document.getElementById("city").value;
            let result = document.getElementById("result");

            if (city === "") {
                result.innerHTML = "Enter a city name";
                return;
            }

            try {
                let response = await fetch(
                    "https://geocoding-api.open-meteo.com/v1/search?name="
                    + encodeURIComponent(city) + "&count=1"
                );

                let data = await response.json();

                if (!data.results) {
                    result.innerHTML = "City not found";
                    return;
                }

                let place = data.results[0];

                let weatherResponse = await fetch(
                    "https://api.open-meteo.com/v1/forecast?latitude="
                    + place.latitude + "&longitude=" + place.longitude
                    + "&current=temperature_2m,relative_humidity_2m"
                );

                let weather = await weatherResponse.json();

                result.innerHTML =
                    "<h3>" + place.name + "</h3>" +
                    "<p>Temperature: " +
                    weather.current.temperature_2m + " °C</p>" +
                    "<p>Humidity: " +
                    weather.current.relative_humidity_2m + "%</p>";

            } catch (error) {
                result.innerHTML = "Error fetching weather data";
            }
        }
    </script>

</body>
</html>
